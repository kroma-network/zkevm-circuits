[package]
name = "mock"
version = "0.1.0"
edition = "2021"
authors = ["The appliedzkp team"]
license = "MIT OR Apache-2.0"

[dependencies]
eth-types = { path = "../eth-types" }
external-tracer = { path = "../external-tracer" }
lazy_static = "1.4"
itertools = "0.10.3"
ethers-signers = { git = "https://github.com/kroma-network/ethers-rs.git", branch = "feat/upstream-scroll-v0.9.9" }
ethers-core = { git = "https://github.com/kroma-network/ethers-rs.git", branch = "feat/upstream-scroll-v0.9.9", features = ["scroll"] }
rand_chacha = "0.3"
rand = "0.8"
log = "0.4"

[features]
default = []
shanghai = ["eth-types/shanghai"]
scroll = ["eth-types/scroll", "external-tracer/scroll"]
